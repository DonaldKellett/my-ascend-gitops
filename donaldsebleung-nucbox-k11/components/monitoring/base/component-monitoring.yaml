---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: component-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/prometheus-community/charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0
    helm:
      valuesObject:
        crds:
          upgradeJob:
            enabled: false
        alertmanager:
          networkPolicy:
            enabled: true
        grafana:
          ingress:
            enabled: true
            annotations:
              cluster-name: donaldsebleung-nucbox-k11
            hosts:
              - grafana.internal.donaldsebleung.com
            tls:
              - secretName: monitoring-grafana-tls
                hosts:
                  - grafana.internal.donaldsebleung.com
        prometheusOperator:
          networkPolicy:
            enabled: true
        prometheus:
          networkPolicy:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
