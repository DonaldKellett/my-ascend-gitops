---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: component-mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/mlflow/charts
    chart: mlflow
    targetRevision: 0.1.0
    helm:
      valuesObject:
        image:
          tag: v3.15.1
        garbageCollection:
          enabled: true
        ingress:
          enabled: true
          annotations:
            cluster-name: donaldsebleung-nucbox-k11
          hosts:
            - host: mlflow.internal.donaldsebleung.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - mlflow.internal.donaldsebleung.com
              secretName: mlflow-tls
        mlflow:
          backendStoreUri: "sqlite:////mlflow/mlflow.db"
          artifactsDestination: "/mlflow/artifacts"
        networkPolicy:
          enabled: true
        storage:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
