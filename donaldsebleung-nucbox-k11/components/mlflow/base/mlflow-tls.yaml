---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: 'Wait=true'
  name: mlflow-tls
  namespace: mlflow
spec:
  secretName: mlflow-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: root-ca-clusterissuer
    kind: ClusterIssuer
  commonName: mlflow.internal.donaldsebleung.com
  dnsNames:
    - mlflow.internal.donaldsebleung.com
